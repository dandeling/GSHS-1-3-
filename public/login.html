<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · 1-3반 커뮤니티</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main style="max-width:420px">
    <div class="card">
      <h1>로그인</h1>
      <div id="msg" class="hidden"></div>
      <form id="form">
        <label>별명 또는 학교 이메일</label>
        <input id="login" autocomplete="username" required />
        <label>비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <!-- 2단계 인증 코드 (설정된 계정만 표시) -->
        <div id="totpBox" class="hidden">
          <label>🔐 인증 앱 코드 <span class="muted">(6자리)</span></label>
          <input id="totp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" />
        </div>
        <div id="capBox" style="margin-top:12px"></div>
        <div style="margin-top:16px"><button type="submit" class="grow" style="width:100%">로그인</button></div>
      </form>
      <p class="muted" style="margin-top:14px">계정이 없나요? <a href="/register.html">회원가입</a> · <a href="/find.html">아이디·비밀번호 찾기</a></p>
      <p class="muted">※ 자동 로그인 없음 — 브라우저를 닫으면 로그아웃됩니다.</p>
    </div>
  </main>
  <script type="module">
    import { renderNav, api, showMsg, captchaWidget } from '/js/common.js';
    await renderNav();
    const msg = document.getElementById('msg');
    const cap = captchaWidget(document.getElementById('capBox'));
    const totpBox = document.getElementById('totpBox');
    let twoFactor = false;

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        login: document.getElementById('login').value.trim(),
        password: document.getElementById('password').value,
        captchaToken: cap.token(),
        captchaAnswer: cap.answer(),
      };
      if (twoFactor) body.totpCode = document.getElementById('totp').value.trim();
      try {
        await api.post('/api/auth/login', body);
        location.href = '/';
      } catch (err) {
        if (err.data?.twoFactorRequired) {
          // 비밀번호는 맞음 → 인증 앱 코드 단계로 전환 (캡차는 그대로 유지)
          twoFactor = true;
          totpBox.classList.remove('hidden');
          document.getElementById('totp').focus();
          showMsg(msg, err.message);
        } else {
          showMsg(msg, err.message);
          cap.refresh(); cap.clear();   // 실패 시 새 캡차
        }
      }
    });
  </script>
</body>
</html>
