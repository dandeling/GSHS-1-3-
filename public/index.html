<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1-3반 커뮤니티 · 경남과학고</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <!-- 히어로 -->
    <div class="card hero">
      <div class="row" style="align-items:flex-start">
        <div class="grow">
          <div class="eyebrow">Student Board · 경남과학고등학교</div>
          <div class="big">1-3반 커뮤니티</div>
          <div class="desc">우리 학교 학생만의 자유게시판 🐝 편하게 써보세요</div>
        </div>
        <div class="logo-circle">1-3</div>
      </div>
      <div id="authCta"></div>
      <!-- D-day + 출석 -->
      <div id="widgets" class="hidden" style="margin-top:14px">
        <div id="ddayRow" class="dday-row"></div>
        <button id="attendBtn" class="btn-ghost btn-sm" style="margin-top:10px">📅 오늘 출석체크</button>
        <span id="attendMsg" class="muted" style="margin-left:8px"></span>
      </div>
    </div>

    <!-- 오늘의 급식 -->
    <div class="section-title">🍽️ 오늘의 급식 <span class="sub" id="mealDate"></span><span class="line"></span></div>
    <div class="card" id="mealCard"><div class="empty">불러오는 중…</div></div>

    <!-- 지금 인기 있는 글 -->
    <div class="section-title">📌 지금 인기 있는 글<span class="line"></span></div>
    <div class="card" id="popularCard"><div class="empty">불러오는 중…</div></div>

    <!-- 명예의 전당 -->
    <div class="section-title">🏆 명예의 전당 <span class="sub">이달의 인기 글쓴이</span><span class="line"></span></div>
    <div class="card" id="fameCard"><div class="empty">불러오는 중…</div></div>

    <!-- 카테고리 + 검색 + 글 목록 -->
    <div class="section-title">📝 전체 글<span class="line"></span></div>
    <div class="card">
      <div class="pills" id="pills"></div>
      <div class="search-row">
        <div class="search grow"><input id="q" placeholder="제목·내용 검색" /></div>
        <select id="sort">
          <option value="recent">최신순</option>
          <option value="popular">인기순</option>
        </select>
      </div>
      <div id="feed" style="margin-top:8px"></div>
      <div class="pager" id="pager"></div>
    </div>
  </main>

  <a class="fab hidden" id="fab" href="/write.html?board=free">✏️ 글쓰기</a>

  <script type="module">
    import { renderNav, api, esc, fmt, qs, getMeta, renderDcTable, levelBadge } from '/js/common.js';
    const me = await renderNav();

    // 로그인 안내 / 글쓰기 버튼
    if (!me) {
      document.getElementById('authCta').innerHTML = `<a class="btn btn-block" href="/login.html" style="margin-top:8px">로그인 / 회원가입</a>
        <p class="muted" style="text-align:center;margin-top:10px">재학생 전용 · 학교 이메일로 로그인하면 게시글을 볼 수 있어요</p>`;
    } else {
      document.getElementById('fab').classList.remove('hidden');
    }

    // 홈 대시보드
    try {
      const h = await api.get('/api/home');
      const md = new Date(h.today);
      document.getElementById('mealDate').textContent = `${md.getMonth()+1}월 ${md.getDate()}일`;
      const mealSrc = h.meal && h.meal.source === 'neis' ? ' <span class="lv" style="background:none">🍽 NEIS 자동</span>' : '';
      document.getElementById('mealCard').innerHTML = h.meal
        ? `<div style="white-space:pre-wrap;font-size:15px">${esc(h.meal.content)}</div><div class="muted" style="margin-top:8px;font-size:11px">${mealSrc}</div>`
        : `<div class="empty">오늘은 등록된 급식 정보가 없어요. (주말·방학 등)</div>`;

      // D-day + 출석 위젯
      document.getElementById('widgets').classList.remove('hidden');
      const dr = document.getElementById('ddayRow');
      dr.innerHTML = h.ddays.length
        ? h.ddays.map((d) => `<span class="dday-chip"><b>${esc(d.title)}</b> ${d.dleft===0?'D-DAY':'D-'+d.dleft}</span>`).join('')
        : `<span class="muted" style="font-size:12px">등록된 D-day가 없어요.</span>`;
      const ab = document.getElementById('attendBtn'), am = document.getElementById('attendMsg');
      if (h.attendance.checkedToday) { ab.disabled = true; ab.textContent = '✅ 출석완료'; am.textContent = `누적 ${h.attendance.total}일`; }
      else ab.addEventListener('click', async () => {
        const r = await api.post('/api/home/attendance');
        ab.disabled = true; ab.textContent = '✅ 출석완료'; am.textContent = `누적 ${r.total||''}일 · +2점`;
      });

      document.getElementById('popularCard').innerHTML = h.popular.length
        ? h.popular.map((p, i) => `<div class="rank-item" onclick="location.href='/post.html?id=${p.id}'">
            <div class="rank-no">${i+1}</div>
            <div class="grow"><div class="p-title">${esc(p.title)}</div>
            <div class="p-meta">${levelBadge(p.author_point, p.author_role)} <span>${esc(p.author)}</span><span>👁 ${p.views}</span><b>❤ ${p.like_count}</b><span>💬 ${p.comment_count}</span></div></div>
          </div>`).join('')
        : `<div class="empty">아직 게시글이 없어요.</div>`;

      const medals = ['🥇','🥈','🥉'];
      document.getElementById('fameCard').innerHTML = h.hallOfFame.length
        ? `<div class="fame">${h.hallOfFame.map((f, i) => `<div class="fame-card">
            <div class="fame-medal">${medals[i]}</div><div class="fame-name">${esc(f.author)}</div>
            <div style="margin:2px 0">${levelBadge(f.author_point, f.author_role)}</div>
            <div class="fame-stat">글 ${f.post_count} · ❤ ${f.like_count}</div></div>`).join('')}</div>`
        : `<div class="empty">아직 명예의 전당 기록이 없어요.</div>`;
    } catch (e) {
      // 미로그인 시 홈 API 401 → 조용히 안내
      ['mealCard','popularCard','fameCard'].forEach((id) =>
        document.getElementById(id).innerHTML = `<div class="empty">로그인하면 볼 수 있어요.</div>`);
    }

    // 카테고리 알약
    let tag = qs('tag') || '';
    let sort = qs('sort') || 'recent';
    let q = '';
    let page = 1;
    const meta = await getMeta().catch(() => ({ tags: [] }));
    const pillsEl = document.getElementById('pills');
    const pills = [{ code: '', name: '전체' }, { code: '__notice', name: '📢 공지' }, ...meta.tags.map((t) => ({ code: t.code, name: `${t.emoji} ${t.name}` }))];
    function renderPills() {
      pillsEl.innerHTML = pills.map((p) => `<span class="pill ${((tag||'')===p.code)?'active':''}" data-tag="${p.code}">${esc(p.name)}</span>`).join('');
      pillsEl.querySelectorAll('.pill').forEach((el) => el.addEventListener('click', () => { tag = el.dataset.tag; page = 1; loadFeed(); renderPills(); }));
    }

    const feedEl = document.getElementById('feed');
    const tagName = (c) => { const t = meta.tags.find((x)=>x.code===c); return t ? `${t.emoji} ${t.name}` : ''; };
    async function loadFeed() {
      if (!me) { feedEl.innerHTML = `<div class="empty">로그인 후 글을 볼 수 있어요.</div>`; document.getElementById('pager').innerHTML=''; return; }
      const params = new URLSearchParams({ page, sort });
      if (tag === '__notice') params.set('board', 'notice');
      else { params.set('board', 'all'); if (tag) params.set('tag', tag); }
      if (q) params.set('q', q);
      const d = await api.get('/api/posts?' + params);
      feedEl.innerHTML = renderDcTable(d.posts, tagName);
      let html = '';
      for (let i = 1; i <= d.totalPages; i++) html += i===d.page ? `<span class="active">${i}</span>` : `<span data-pg="${i}">${i}</span>`;
      const pg = document.getElementById('pager');
      pg.innerHTML = d.totalPages > 1 ? html : '';
      pg.querySelectorAll('[data-pg]').forEach((s) => s.addEventListener('click', () => { page = +s.dataset.pg; loadFeed(); scrollTo({top: feedEl.offsetTop-60, behavior:'smooth'}); }));
    }

    // 검색/정렬 이벤트
    let t;
    document.getElementById('q').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { q = e.target.value.trim(); page = 1; loadFeed(); }, 300); });
    document.getElementById('sort').value = sort;
    document.getElementById('sort').addEventListener('change', (e) => { sort = e.target.value; page = 1; loadFeed(); });

    renderPills();
    loadFeed();
  </script>
</body>
</html>
