<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 · 1-3반 커뮤니티</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main style="max-width:460px">
    <div class="card">
      <h1>회원가입</h1>
      <div id="msg" class="hidden"></div>
      <form id="form">
        <label>학교 이메일 <span class="muted">((기수)gshs-(학번)@g.gne.go.kr)</span></label>
        <input id="email" placeholder="43gshs-1319@g.gne.go.kr" required />
        <!-- 이메일 인증 (SMTP 설정 시에만 표시) -->
        <div id="verifyBox" class="hidden">
          <div class="row" style="margin-top:6px"><button type="button" id="sendCode" class="btn-sm btn-ghost">인증코드 받기</button>
            <input id="code" placeholder="인증코드 6자리" style="flex:1" maxlength="6" inputmode="numeric" />
            <button type="button" id="verifyCode" class="btn-sm">확인</button></div>
          <p class="muted" id="verifyState" style="margin:4px 0 0"></p>
        </div>
        <label>별명 <span class="muted">(화면에 보이는 이름)</span></label>
        <input id="username" maxlength="20" required />
        <label>실명 <span class="muted">(관리자만 확인)</span></label>
        <input id="realname" maxlength="20" required />
        <label>비밀번호 <span class="muted">(6자 이상)</span></label>
        <input id="password" type="password" autocomplete="new-password" required />
        <label>비밀번호 확인 <span class="muted">(한 번 더 입력)</span></label>
        <input id="password2" type="password" autocomplete="new-password" required />
        <p class="muted hidden" id="pwMatch" style="margin:4px 0 0;font-size:12px"></p>
        <div id="capBox" style="margin-top:12px"></div>
        <div style="margin-top:16px"><button type="submit" style="width:100%">가입 신청</button></div>
      </form>
      <p class="muted" style="margin-top:14px">가입 신청 후 <b>관리자 승인</b>이 완료되면 로그인할 수 있습니다.</p>
      <p class="muted">이미 계정이 있나요? <a href="/login.html">로그인</a></p>
    </div>
  </main>
  <script type="module">
    import { renderNav, api, showMsg, captchaWidget } from '/js/common.js';
    await renderNav();
    const msg = document.getElementById('msg');
    const cap = captchaWidget(document.getElementById('capBox'));

    // 비밀번호 확인 실시간 안내
    const pw = document.getElementById('password'), pw2 = document.getElementById('password2'), pwm = document.getElementById('pwMatch');
    const checkMatch = () => {
      if (!pw2.value) { pwm.classList.add('hidden'); return true; }
      const ok = pw.value === pw2.value;
      pwm.classList.remove('hidden');
      pwm.textContent = ok ? '✅ 비밀번호가 일치합니다.' : '⚠️ 비밀번호가 일치하지 않습니다.';
      pwm.style.color = ok ? 'var(--green)' : 'var(--danger)';
      return ok;
    };
    pw.addEventListener('input', checkMatch); pw2.addEventListener('input', checkMatch);

    // 이메일 인증 사용 여부
    let mailOn = false, verified = false;
    try { mailOn = (await api.get('/api/auth/mail-status')).enabled; } catch {}
    if (mailOn) document.getElementById('verifyBox').classList.remove('hidden');

    const vs = () => document.getElementById('verifyState');
    document.getElementById('sendCode')?.addEventListener('click', async () => {
      try { const d = await api.post('/api/auth/send-code', { email: document.getElementById('email').value.trim(), purpose: 'register' }); vs().textContent = '📩 ' + d.message; vs().style.color = 'var(--green)'; }
      catch (e) { vs().textContent = e.message; vs().style.color = 'var(--danger)'; }
    });
    document.getElementById('verifyCode')?.addEventListener('click', async () => {
      try {
        await api.post('/api/auth/verify-code', { email: document.getElementById('email').value.trim(), code: document.getElementById('code').value.trim(), purpose: 'register' });
        verified = true; vs().textContent = '✅ 이메일 인증 완료'; vs().style.color = 'var(--green)';
      } catch (e) { vs().textContent = e.message; vs().style.color = 'var(--danger)'; }
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (mailOn && !verified) { showMsg(msg, '이메일 인증을 먼저 완료해주세요.'); return; }
      if (pw.value.length < 6) { showMsg(msg, '비밀번호는 6자 이상이어야 합니다.'); return; }
      if (!checkMatch()) { showMsg(msg, '비밀번호와 비밀번호 확인이 일치하지 않습니다.'); return; }
      try {
        const d = await api.post('/api/auth/register', {
          email: document.getElementById('email').value.trim(),
          username: document.getElementById('username').value.trim(),
          realname: document.getElementById('realname').value.trim(),
          password: pw.value,
          passwordConfirm: pw2.value,
          captchaToken: cap.token(),
          captchaAnswer: cap.answer(),
        });
        showMsg(msg, d.message, true);
        document.getElementById('form').reset();
        pwm.classList.add('hidden');
        cap.refresh();
      } catch (err) { showMsg(msg, err.message); cap.refresh(); cap.clear(); }
    });
  </script>
</body>
</html>
