# Render.com 배포 설정 (무료 + Turso 클라우드 DB)
# GitHub에 push하면 자동으로 사이트가 업데이트됩니다.
# 데이터는 Turso(클라우드 SQLite)에 저장되므로 재배포해도 유지됩니다.
services:
  - type: web
    name: gshs-1-3-community
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # Turso DB URL (libsql://...)
        sync: false                 # Render 대시보드에서 직접 입력
      - key: DATABASE_AUTH_TOKEN    # Turso 인증 토큰
        sync: false
      - key: ADMIN_PASSWORD         # 관리자 비밀번호
        sync: false
      - key: JWT_SECRET
        generateValue: true         # 자동 생성
