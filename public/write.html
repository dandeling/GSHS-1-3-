<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글쓰기 · 1-3반 커뮤니티</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div class="card">
      <h1 id="pageTitle">✏️ 글쓰기</h1>
      <div id="msg" class="hidden"></div>
      <form id="form">
        <div id="tagField" class="hidden">
          <label>말머리</label>
          <div class="pills" id="tagPills"></div>
        </div>
        <div id="resourceFields" class="hidden">
          <div class="row">
            <div class="grow"><label>과목</label><select id="subject"></select></div>
            <div class="grow"><label>분류</label><select id="category"></select></div>
          </div>
        </div>
        <label>제목</label>
        <input id="title" maxlength="120" placeholder="제목을 입력하세요" required />
        <label>내용</label>
        <textarea id="content" placeholder="내용을 입력하세요" required></textarea>

        <!-- 파일 첨부 (새 글만) -->
        <div id="fileField" class="hidden">
          <label>📎 파일 첨부 <span class="muted">(이미지·PDF 등 · 약 3MB 이하 · 선택)</span></label>
          <div class="row">
            <button type="button" id="attachBtn" class="btn-ghost btn-sm">📎 첨부하기</button>
            <button type="button" id="attachClear" class="btn-ghost btn-sm hidden">✕ 첨부 취소</button>
          </div>
          <input type="file" id="file" accept="image/*,.pdf,.hwp,.hwpx,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip" class="hidden" />
          <div id="fileInfo" class="muted" style="font-size:12px;margin-top:6px"></div>
        </div>

        <!-- 투표 첨부 (자유게시판, 새 글만) -->
        <div id="pollField" class="hidden">
          <label><input type="checkbox" id="pollOn" style="width:auto;margin-right:6px">🗳️ 투표 추가</label>
          <div id="pollInputs" class="hidden" style="margin-top:6px">
            <input id="pollQ" placeholder="투표 질문 (예: 반티 뭐로 할까?)" maxlength="100" />
            <div id="pollOpts" style="margin-top:8px"></div>
            <button type="button" id="addOpt" class="btn-ghost btn-sm" style="margin-top:6px">+ 선택지 추가</button>
          </div>
        </div>

        <div class="row" style="margin-top:16px">
          <button type="submit">저장</button>
          <a href="javascript:history.back()" class="btn btn-ghost">취소</a>
        </div>
      </form>
    </div>
  </main>
  <script type="module">
    import { renderNav, api, qs, showMsg, getMeta } from '/js/common.js';
    const me = await renderNav({ requireLogin: true });
    const meta = await getMeta();
    const msg = document.getElementById('msg');
    const editId = qs('id');
    let board = qs('board') || 'free';
    let selectedTag = qs('tag') || 'talk';

    let editing = null;
    if (editId) {
      const d = await api.get('/api/posts/' + editId);
      editing = d.post; board = editing.board;
      selectedTag = editing.tag || 'talk';
      document.getElementById('pageTitle').textContent = '✏️ 글 수정';
      document.getElementById('title').value = editing.title;
      document.getElementById('content').value = editing.content;
    }

    if (board === 'notice' && me.role !== 'admin') {
      showMsg(msg, '공지사항은 관리자만 작성할 수 있습니다.');
      document.getElementById('form').classList.add('hidden');
    }

    // 파일 첨부 (새 글 작성 시) — '첨부하기' 버튼 → 파일 선택 → data URL
    let attachData = null, attachName = null;
    if (!editId) {
      document.getElementById('fileField').classList.remove('hidden');
      const fileEl = document.getElementById('file');
      const info = document.getElementById('fileInfo');
      const clearBtn = document.getElementById('attachClear');
      document.getElementById('attachBtn').addEventListener('click', () => fileEl.click());
      clearBtn.addEventListener('click', () => { attachData = null; attachName = null; fileEl.value = ''; info.textContent = ''; clearBtn.classList.add('hidden'); });
      fileEl.addEventListener('change', (e) => {
        const f = e.target.files[0];
        attachData = null; attachName = null; clearBtn.classList.add('hidden');
        if (!f) { info.textContent = ''; return; }
        if (f.size > 3 * 1024 * 1024) { info.textContent = '⚠️ 파일이 너무 커요 (3MB 이하로).'; info.style.color = 'var(--danger)'; fileEl.value = ''; return; }
        const reader = new FileReader();
        reader.onload = () => { attachData = reader.result; attachName = f.name; info.textContent = `첨부됨: ${f.name} (${Math.round(f.size/1024)}KB)`; info.style.color = 'var(--green)'; clearBtn.classList.remove('hidden'); };
        reader.readAsDataURL(f);
      });
    }

    // 자유게시판: 말머리 알약 + 투표
    if (board === 'free') {
      document.getElementById('tagField').classList.remove('hidden');
      const tp = document.getElementById('tagPills');
      const render = () => { tp.innerHTML = meta.tags.map((t) => `<span class="pill ${selectedTag===t.code?'active':''}" data-t="${t.code}">${t.emoji} ${t.name}</span>`).join(''); tp.querySelectorAll('[data-t]').forEach((el)=>el.addEventListener('click',()=>{selectedTag=el.dataset.t;render();})); };
      render();

      // 투표는 새 글 작성 시에만
      if (!editId) {
        document.getElementById('pollField').classList.remove('hidden');
        const optsBox = document.getElementById('pollOpts');
        const addOpt = (val='') => { const d = document.createElement('div'); d.className='poll-add-opt'; d.innerHTML = `<input class="grow poll-o" placeholder="선택지" maxlength="60" value="${val}"><button type="button" class="btn-ghost btn-sm rm">✕</button>`; d.querySelector('.rm').addEventListener('click',()=>d.remove()); optsBox.appendChild(d); };
        addOpt(); addOpt();
        document.getElementById('addOpt').addEventListener('click', () => { if (optsBox.children.length < 8) addOpt(); });
        document.getElementById('pollOn').addEventListener('change', (e) => document.getElementById('pollInputs').classList.toggle('hidden', !e.target.checked));
      }
    }

    // 자료게시판: 과목/분류
    if (board === 'resource') {
      document.getElementById('resourceFields').classList.remove('hidden');
      const ss = document.getElementById('subject'), cs = document.getElementById('category');
      ss.innerHTML = meta.subjects.map((s) => `<option value="${s.code}">${s.name}</option>`).join('');
      cs.innerHTML = meta.categories.map((c) => `<option value="${c.code}">${c.name}</option>`).join('');
      if (editing) { ss.value = editing.subject; cs.value = editing.category; }
      else { if (qs('subject')) ss.value = qs('subject'); if (qs('category')) cs.value = qs('category'); }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = { board, title: document.getElementById('title').value.trim(), content: document.getElementById('content').value.trim() };
      if (board === 'free') {
        body.tag = selectedTag;
        if (!editId && document.getElementById('pollOn')?.checked) {
          const q = document.getElementById('pollQ').value.trim();
          const opts = [...document.querySelectorAll('.poll-o')].map((i) => i.value.trim()).filter(Boolean);
          if (q && opts.length >= 2) body.poll = { question: q, options: opts };
        }
      }
      if (board === 'resource') { body.subject = document.getElementById('subject').value; body.category = document.getElementById('category').value; }
      if (!editId && attachData) { body.attachment = attachData; body.attachment_name = attachName; }
      try {
        if (editId) { await api.put('/api/posts/' + editId, body); location.href = '/post.html?id=' + editId; }
        else { const r = await api.post('/api/posts', body); location.href = '/post.html?id=' + r.id; }
      } catch (err) { showMsg(msg, err.message); }
    });
  </script>
</body>
</html>
