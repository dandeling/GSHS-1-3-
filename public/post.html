<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글 보기 · 1-3반 커뮤니티</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div class="card" id="postCard">불러오는 중…</div>

    <div class="card">
      <h2>댓글 <span id="ccount" class="muted"></span></h2>
      <div id="comments"></div>
      <form id="commentForm" style="margin-top:14px">
        <div class="row">
          <input id="commentInput" class="grow" placeholder="댓글 입력 (비속어 시 벌점 +1)" required />
          <button type="submit">등록</button>
        </div>
      </form>
      <div id="cmsg" class="hidden"></div>
    </div>

    <div class="card hidden" id="traceCard">
      <h2>🔎 흔적 (수정·삭제 이력)</h2>
      <div id="traceBody" class="muted">불러오는 중…</div>
    </div>
  </main>
  <script type="module">
    import { renderNav, api, esc, fmt, qs, showMsg, getMeta, levelBadge, can } from '/js/common.js';
    const me = await renderNav({ requireLogin: true });
    const meta = await getMeta();
    const id = qs('id');
    let data;

    // 첨부 렌더링: 이미지는 인라인, 그 외는 다운로드 링크
    const attachHtml = (p) => {
      if (!p.attachment) return '';
      const name = esc(p.attachment_name || '첨부파일');
      if (/^data:image\//.test(p.attachment)) {
        return `<div style="margin-top:14px"><img src="${p.attachment}" alt="${name}" style="max-width:100%;border-radius:10px;border:1px solid var(--line)" />
          <div style="margin-top:6px"><a href="${p.attachment}" download="${name}" class="btn btn-ghost btn-sm">📎 ${name} 다운로드</a></div></div>`;
      }
      return `<div style="margin-top:14px"><a href="${p.attachment}" download="${name}" class="btn btn-ghost btn-sm">📎 ${name} 다운로드</a></div>`;
    };

    const tagLabel = (p) => {
      if (p.board === 'notice') return '<span class="tag-chip notice">📢 공지</span>';
      if (p.board === 'resource' && p.subject) { const s = meta.subjects.find((x)=>x.code===p.subject); return `<span class="tag-chip">${esc(s?s.name:'')}${p.category==='exam'?' · 시험':' · 수행'}</span>`; }
      if (p.tag) { const t = meta.tags.find((x)=>x.code===p.tag); return t?`<span class="tag-chip">${t.emoji} ${esc(t.name)}</span>`:''; }
      return '';
    };

    async function load() {
      data = await api.get('/api/posts/' + id);
      const p = data.post;
      const canEdit = p.author_id === me.id || can(me, 'moderate');
      document.getElementById('postCard').innerHTML = `
        <div class="row"><a href="javascript:history.back()" class="muted grow">← 목록</a>
          ${canEdit ? `<a class="btn btn-ghost btn-sm" href="/write.html?id=${p.id}">수정</a>
          <button class="btn-danger btn-sm" id="delBtn">삭제</button>` : ''}
          ${!canEdit ? `<button class="btn-ghost btn-sm" id="reportBtn">🚨 신고</button>` : ''}
          ${can(me, 'audit') ? `<button class="btn-ghost btn-sm" id="traceBtn">흔적</button>` : ''}
        </div>
        <div class="p-top" style="margin-top:12px">${tagLabel(p)}</div>
        <h1 style="margin:6px 0">${esc(p.title)}</h1>
        <p class="muted">${levelBadge(p.author_point, p.author_role, p.author_rank)} <b class="clickable-user" style="color:var(--text)" onclick="location.href='/profile.html?u=${encodeURIComponent(p.author).replace(/'/g,'%27')}'">${esc(p.author)}</b> · ${fmt(p.created_at)} ${p.updated_at ? '(수정됨)' : ''} · 조회 ${p.views}</p>
        <hr />
        <div style="white-space:pre-wrap;font-size:15.5px;min-height:40px">${esc(p.content)}</div>
        ${attachHtml(p)}
        <div id="pollBox"></div>
        <div style="text-align:center;margin-top:22px">
          <button class="like-btn ${p.liked?'on':''}" id="likeBtn">❤ 좋아요 <span id="likeCount">${p.like_count}</span></button>
        </div>
        <div class="react-bar" id="reactBar"></div>`;

      renderPoll();
      renderReactions();

      document.getElementById('likeBtn').addEventListener('click', async () => {
        const r = await api.post(`/api/posts/${id}/like`);
        document.getElementById('likeCount').textContent = r.like_count;
        document.getElementById('likeBtn').classList.toggle('on', r.liked);
      });
      if (canEdit) document.getElementById('delBtn').addEventListener('click', async () => {
        if (!confirm('정말 삭제할까요?')) return;
        await api.del('/api/posts/' + id); history.back();
      });
      if (can(me, 'audit')) document.getElementById('traceBtn').addEventListener('click', loadTrace);
      if (!canEdit) document.getElementById('reportBtn').addEventListener('click', () => reportTarget('post', id));
      renderComments();
    }

    function renderReactions() {
      const bar = document.getElementById('reactBar');
      if (!bar || !data.reactions) return;
      const r = data.reactions;
      bar.innerHTML = r.emojis.map((e) => {
        const cnt = r.counts[e] || 0;
        return `<button class="react-btn ${r.mine===e?'on':''}" data-emoji="${e}">${e}${cnt?`<span class="rc">${cnt}</span>`:''}</button>`;
      }).join('');
      bar.querySelectorAll('[data-emoji]').forEach((b) => b.addEventListener('click', async () => {
        const res = await api.post(`/api/posts/${id}/react`, { emoji: b.dataset.emoji });
        data.reactions = res.reactions; renderReactions();
      }));
    }

    function renderPoll() {
      const box = document.getElementById('pollBox');
      if (!box || !data.poll) return;
      const pl = data.poll;
      box.innerHTML = `<div class="poll"><div class="poll-q">🗳️ ${esc(pl.question)}</div>
        ${pl.options.map((o) => {
          const pct = pl.total ? Math.round(o.votes / pl.total * 100) : 0;
          const voted = pl.myOption === o.id;
          return `<div class="poll-opt ${voted?'voted':''}" data-opt="${o.id}">
            <div class="bar" style="width:${pl.myOption?pct:0}%"></div>
            <div class="lbl"><span>${voted?'✓ ':''}${esc(o.text)}</span>${pl.myOption?`<span class="pct">${pct}% (${o.votes})</span>`:''}</div>
          </div>`;
        }).join('')}
        <div class="poll-total">${pl.myOption?`총 ${pl.total}표`:'선택지를 눌러 투표하세요'}</div></div>`;
      box.querySelectorAll('[data-opt]').forEach((el) => el.addEventListener('click', async () => {
        const r = await api.post(`/api/posts/${id}/poll/vote`, { option_id: +el.dataset.opt });
        data.poll = r.poll; renderPoll();
      }));
    }

    function renderComments() {
      const all = data.comments;
      document.getElementById('ccount').textContent = all.length;
      const box = document.getElementById('comments');
      if (!all.length) { box.innerHTML = '<p class="muted">첫 댓글을 남겨보세요.</p>'; return; }
      const parents = all.filter((c) => !c.parent_id);
      const childrenOf = (pid) => all.filter((c) => c.parent_id === pid);
      const one = (c, isReply) => `
        <div class="comment ${isReply?'reply':''}">
          ${levelBadge(c.author_point, c.author_role, c.author_rank)} <span class="who clickable-user" data-user="${esc(c.author)}">${esc(c.author)}</span><span class="time">${fmt(c.created_at)}</span>
          ${!isReply ? `<span class="re-btn" data-reply="${c.id}">답글</span>` : ''}
          ${(c.author_id === me.id || can(me, 'moderate')) ? `<a href="#" class="muted" style="float:right;font-size:12px" data-del="${c.id}">삭제</a>` : `<a href="#" class="muted" style="float:right;font-size:12px" data-report="${c.id}">신고</a>`}
          <div style="white-space:pre-wrap">${esc(c.content)}</div>
          <div class="reply-form" data-form="${c.id}"></div>
        </div>`;
      box.innerHTML = parents.map((p) => one(p, false) + childrenOf(p.id).map((r) => one(r, true)).join('')).join('');

      box.querySelectorAll('[data-del]').forEach((a) => a.addEventListener('click', async (e) => {
        e.preventDefault(); if (!confirm('댓글을 삭제할까요?')) return;
        await api.del('/api/posts/comments/' + a.dataset.del); await load();
      }));
      box.querySelectorAll('[data-report]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); reportTarget('comment', a.dataset.report); }));
      box.querySelectorAll('[data-user]').forEach((a) => a.addEventListener('click', () => location.href = '/profile.html?u=' + encodeURIComponent(a.dataset.user)));
      box.querySelectorAll('[data-reply]').forEach((a) => a.addEventListener('click', () => {
        const cid = a.dataset.reply;
        const form = box.querySelector(`[data-form="${cid}"]`);
        if (form.dataset.open) { form.innerHTML = ''; form.dataset.open = ''; return; }
        form.dataset.open = '1';
        form.innerHTML = `<div class="row" style="margin-top:8px"><input class="grow re-input" placeholder="답글 입력"><button class="btn-sm re-send">등록</button></div>`;
        const reBtn = form.querySelector('.re-send');
        let reSending = false;
        reBtn.addEventListener('click', async () => {
          if (reSending) return;
          const val = form.querySelector('.re-input').value.trim();
          if (!val) return;
          reSending = true; reBtn.disabled = true; reBtn.textContent = '등록 중…';
          try { await api.post(`/api/posts/${id}/comments`, { content: val, parent_id: +cid }); await load(); }
          catch (err) { showMsg(document.getElementById('cmsg'), err.message); reSending = false; reBtn.disabled = false; reBtn.textContent = '등록'; }
        });
      }));
    }

    // 신고: 사유 입력받아 접수
    async function reportTarget(kind, targetId) {
      const reason = prompt(kind === 'post' ? '이 글을 신고하는 사유를 적어주세요. (선택)' : '이 댓글을 신고하는 사유를 적어주세요. (선택)');
      if (reason === null) return;   // 취소
      try {
        const url = kind === 'post' ? `/api/posts/${targetId}/report` : `/api/posts/comments/${targetId}/report`;
        const r = await api.post(url, { reason });
        alert(r.message || '신고가 접수됐어요.');
      } catch (e) { alert(e.message); }
    }

    async function loadTrace() {
      const card = document.getElementById('traceCard'); card.classList.remove('hidden');
      const d = await api.get(`/api/posts/${id}/trace`);
      if (!d.logs.length) { document.getElementById('traceBody').textContent = '기록이 없습니다.'; return; }
      const label = { create: '작성', update: '수정 전', delete: '삭제됨' };
      document.getElementById('traceBody').innerHTML = d.logs.map((l) => {
        let snap = ''; try { const s = JSON.parse(l.snapshot); snap = s.title ? `<b>${esc(s.title)}</b><br>${esc(s.content||'')}` : esc(l.snapshot); } catch { snap = esc(l.snapshot||''); }
        return `<div class="comment"><span class="who">[${label[l.action]||l.action}]</span><span class="time">${esc(l.actor||'?')} · ${fmt(l.created_at)}</span>
          <div style="white-space:pre-wrap;font-size:13px;color:var(--muted)">${snap}</div></div>`;
      }).join('');
      card.scrollIntoView({ behavior: 'smooth' });
    }

    let commenting = false;
    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (commenting) return;                 // 중복 등록 방지
      const input = document.getElementById('commentInput');
      if (!input.value.trim()) return;
      commenting = true;
      const btn = e.target.querySelector('button[type=submit]');
      if (btn) { btn.disabled = true; btn.textContent = '등록 중…'; }
      try {
        const r = await api.post(`/api/posts/${id}/comments`, { content: input.value });
        input.value = '';
        if (r.penalty) showMsg(document.getElementById('cmsg'), `⚠️ 비속어 감지 — 벌점 ${r.penalty.demerit}점 (상태: ${r.penalty.status})`);
        else document.getElementById('cmsg').classList.add('hidden');
        await load();
      } catch (err) { showMsg(document.getElementById('cmsg'), err.message); }
      finally { commenting = false; if (btn) { btn.disabled = false; btn.textContent = '등록'; } }
    });

    await load();
  </script>
</body>
</html>
