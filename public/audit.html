<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전체 기록 · 1-3반 커뮤니티</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div class="card">
      <h1>📋 전체 기록</h1>
      <p class="muted">사이트에서 일어난 <b>모든 추가·수정·삭제</b>를 별명·실명·수정한 내용 순으로 볼 수 있어요. 각 줄을 <b>클릭하면 전체 내용</b>(삭제된 글 포함)을 볼 수 있어요. (3개월간 보관)</p>
      <div class="pills" id="filterTabs">
        <span class="pill active" data-f="">전체</span>
        <span class="pill" data-f="글">글·댓글</span>
        <span class="pill" data-f="회원">회원</span>
        <span class="pill" data-f="일정">일정·급식</span>
        <span class="pill" data-f="기타">기타</span>
      </div>
      <div class="tbl-scroll" style="margin-top:10px">
        <table class="dctable" id="auditTable">
          <thead><tr>
            <th style="text-align:left">별명</th>
            <th style="text-align:left">실명</th>
            <th style="text-align:left">수정한거</th>
            <th class="c-date">시각</th>
          </tr></thead>
          <tbody id="auditBody"><tr><td colspan="4" class="muted" style="padding:20px;text-align:center">불러오는 중…</td></tr></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </main>

  <!-- 상세보기 모달 (삭제된 글 전체 내용까지) -->
  <div class="audit-modal-bg hidden" id="modalBg">
    <div class="audit-modal" id="modalBox">
      <div class="row" style="align-items:flex-start">
        <div class="grow" id="modalHead"></div>
        <button class="icon-btn" id="modalClose" style="box-shadow:none">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module">
    import { renderNav, api, esc, fmt } from '/js/common.js';
    await renderNav({ requireLogin: true, requireAdmin: true });

    // 엔티티/동작 → 한글 라벨 + 아이콘
    const ENTITY = {
      post: { name: '글', icon: '📝', group: '글' },
      comment: { name: '댓글', icon: '💬', group: '글' },
      chat: { name: '채팅', icon: '⚡', group: '글' },
      member: { name: '회원', icon: '👤', group: '회원' },
      event: { name: '일정', icon: '📅', group: '일정' },
      meal: { name: '급식', icon: '🍽️', group: '일정' },
      dday: { name: 'D-day', icon: '⏳', group: '일정' },
      special: { name: '8교시·야간', icon: '🌙', group: '기타' },
      timetable: { name: '시간표', icon: '🕐', group: '기타' },
      weekly_poll: { name: '주간투표', icon: '🗳️', group: '기타' },
    };
    const ACTION = { create: { t: '추가', c: 'act-add' }, update: { t: '수정', c: 'act-edit' }, delete: { t: '삭제', c: 'act-del' } };

    // snapshot(JSON 또는 원문) → { title, content, label } 전체 파싱
    function parse(l) {
      let title = '', content = '', label = '';
      try {
        const s = JSON.parse(l.snapshot);
        if (s && typeof s === 'object') { title = s.title || ''; content = s.content || ''; label = s.label || ''; }
        else content = String(l.snapshot ?? '');
      } catch { content = String(l.snapshot ?? ''); }
      return { title, content, label };
    }

    // 표에 보여줄 짧은 요약
    function summary(l) {
      const p = parse(l);
      let detail = p.label || p.title || p.content || '';
      detail = detail.replace(/\s+/g, ' ').trim();
      if (detail.length > 80) detail = detail.slice(0, 80) + '…';
      return detail;
    }

    let page = 1, filter = '';
    let current = [];      // 현재 화면에 표시 중인 로그 (모달 참조용)
    const body = document.getElementById('auditBody');

    async function load() {
      body.innerHTML = `<tr><td colspan="4" class="muted" style="padding:20px;text-align:center">불러오는 중…</td></tr>`;
      const d = await api.get('/api/admin/audit?page=' + page);
      let logs = d.logs;
      if (filter) logs = logs.filter((l) => (ENTITY[l.entity_type]?.group || '기타') === filter);
      current = logs;
      if (!logs.length) {
        body.innerHTML = `<tr><td colspan="4" class="muted" style="padding:20px;text-align:center">기록이 없어요.</td></tr>`;
      } else {
        body.innerHTML = logs.map((l, i) => {
          const ent = ENTITY[l.entity_type] || { name: l.entity_type, icon: '•' };
          const act = ACTION[l.action] || { t: l.action, c: '' };
          const nick = l.username ? esc(l.username) : '<span class="muted">시스템</span>';
          const real = l.realname ? esc(l.realname) : '<span class="muted">-</span>';
          return `<tr class="audit-row" data-idx="${i}">
            <td>${nick}</td>
            <td>${real}</td>
            <td><span class="audit-badge ${act.c}">${ent.icon} ${ent.name} ${act.t}</span> ${esc(summary(l))} <span class="audit-more">자세히 ▸</span></td>
            <td class="c-date">${fmt(l.created_at)}</td>
          </tr>`;
        }).join('');
        body.querySelectorAll('.audit-row').forEach((tr) => tr.addEventListener('click', () => openModal(current[+tr.dataset.idx])));
      }
      let html = '';
      for (let i = 1; i <= d.totalPages; i++) html += i === d.page ? `<span class="active">${i}</span>` : `<span data-pg="${i}">${i}</span>`;
      const pg = document.getElementById('pager');
      pg.innerHTML = d.totalPages > 1 ? html : '';
      pg.querySelectorAll('[data-pg]').forEach((s) => s.addEventListener('click', () => { page = +s.dataset.pg; load(); scrollTo({ top: 0, behavior: 'smooth' }); }));
    }

    // 상세 모달 열기 (삭제된 글도 저장된 스냅샷으로 전체 내용 표시)
    const modalBg = document.getElementById('modalBg');
    function openModal(l) {
      if (!l) return;
      const ent = ENTITY[l.entity_type] || { name: l.entity_type, icon: '•' };
      const act = ACTION[l.action] || { t: l.action, c: '' };
      const p = parse(l);
      document.getElementById('modalHead').innerHTML = `
        <div><span class="audit-badge ${act.c}">${ent.icon} ${ent.name} ${act.t}</span></div>
        <div class="muted" style="font-size:13px;margin-top:8px">
          별명 <b style="color:var(--text)">${l.username ? esc(l.username) : '시스템'}</b>
          · 실명 <b style="color:var(--text)">${l.realname ? esc(l.realname) : '-'}</b>
          · ${fmt(l.created_at)}</div>`;
      let inner = '';
      if (l.action === 'delete' && (ent.group === '글')) {
        inner += `<div class="audit-deleted-tag">🗑️ 삭제된 ${ent.name}의 전체 내용</div>`;
      }
      if (p.title) inner += `<h2 style="margin:12px 0 6px">${esc(p.title)}</h2>`;
      if (p.content) inner += `<div class="audit-content">${esc(p.content)}</div>`;
      if (!p.title && !p.content && p.label) inner += `<div class="audit-content">${esc(p.label)}</div>`;
      if (!p.title && !p.content && !p.label) inner += `<div class="muted">표시할 상세 내용이 없어요.</div>`;

      // 이 작업을 한 사람에게 바로 벌점 부과 (운영자·시스템·강퇴 계정 제외)
      const removed = ['kicked', 'rejected', 'withdrawn'];
      const canPenalize = l.user_id && l.actor_role !== 'admin' && !removed.includes(l.actor_status);
      inner += `<div class="audit-penalty" id="penaltyBox">`;
      if (canPenalize) {
        inner += `<button class="btn-sm" id="penalizeBtn" style="background:var(--danger);color:#fff">⚠️ ${esc(l.username)} 님에게 벌점 +1</button>
          <span class="muted" id="penaltyMsg" style="margin-left:8px;font-size:12px"></span>`;
      } else if (l.actor_role === 'admin') {
        inner += `<span class="muted" style="font-size:12px">운영자에게는 벌점을 줄 수 없어요.</span>`;
      } else if (!l.user_id) {
        inner += `<span class="muted" style="font-size:12px">시스템 기록이라 벌점 대상이 없어요.</span>`;
      } else {
        inner += `<span class="muted" style="font-size:12px">이미 강퇴·탈퇴한 회원이에요.</span>`;
      }
      inner += `</div>`;

      document.getElementById('modalBody').innerHTML = inner;
      const pb = document.getElementById('penalizeBtn');
      if (pb) pb.addEventListener('click', async () => {
        if (!confirm(`${l.username} 님에게 벌점 +1을 부과할까요?\n(누적 3점=1일 정지 / 6점=1주 정지 / 9점=강퇴)`)) return;
        pb.disabled = true;
        const pm = document.getElementById('penaltyMsg');
        try {
          const r = await api.post(`/api/admin/users/${l.user_id}/add-demerit`);
          const S = { active: '활동중', suspended: '정지', kicked: '강퇴' };
          const extra = r.demerit >= 9 ? ' → 강퇴 처리' : r.demerit >= 6 ? ' → 1주 정지' : r.demerit >= 3 ? ' → 1일 정지' : '';
          pm.style.color = 'var(--danger)';
          pm.textContent = `벌점 부과 완료 (누적 ${r.demerit}점 · ${S[r.status] || r.status})${extra}`;
        } catch (e) { pb.disabled = false; pm.textContent = e.message; }
      });
      modalBg.classList.remove('hidden');
    }
    function closeModal() { modalBg.classList.add('hidden'); }
    document.getElementById('modalClose').addEventListener('click', closeModal);
    modalBg.addEventListener('click', (e) => { if (e.target === modalBg) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    document.querySelectorAll('#filterTabs .pill').forEach((el) => el.addEventListener('click', () => {
      document.querySelectorAll('#filterTabs .pill').forEach((p) => p.classList.remove('active'));
      el.classList.add('active');
      filter = el.dataset.f; page = 1; load();
    }));

    load();
  </script>

  <style>
    .audit-badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; margin-right:4px; white-space:nowrap; }
    .act-add { background:#e6f4ea; color:#1e7e34; }
    .act-edit { background:#fff4e0; color:#b8791b; }
    .act-del { background:#fdeaea; color:#c0392b; }
    :root[data-theme="dark"] .act-add { background:#1e3327; color:#7ee2a0; }
    :root[data-theme="dark"] .act-edit { background:#3a2f1a; color:#f0c674; }
    :root[data-theme="dark"] .act-del { background:#3a2020; color:#e88; }
    #auditTable td { vertical-align:top; }
    .audit-row { cursor:pointer; }
    .audit-row:hover { background:var(--hover, rgba(0,0,0,0.03)); }
    .audit-more { font-size:11px; color:var(--muted); margin-left:2px; white-space:nowrap; }
    .audit-modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px; }
    .audit-modal-bg.hidden { display:none; }
    .audit-modal { background:var(--card, #fff); color:var(--text); border-radius:14px; max-width:640px; width:100%; max-height:82vh; overflow:auto; padding:20px; box-shadow:0 12px 40px rgba(0,0,0,0.3); }
    .audit-deleted-tag { display:inline-block; margin-top:12px; font-size:12px; font-weight:700; color:#c0392b; background:#fdeaea; padding:3px 9px; border-radius:6px; }
    :root[data-theme="dark"] .audit-deleted-tag { background:#3a2020; color:#e88; }
    .audit-content { white-space:pre-wrap; font-size:15px; line-height:1.6; margin-top:8px; word-break:break-word; }
    .audit-penalty { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); }
  </style>
</body>
</html>
