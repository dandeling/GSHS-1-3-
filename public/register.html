<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 · GSHS 1-3</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main style="max-width:460px">
    <div class="card">
      <h1>회원가입</h1>
      <div id="msg" class="hidden"></div>
      <form id="form">
        <label>학교 이메일 <span class="muted">((기수)gshs-(학번)@g.gne.go.kr)</span></label>
        <input id="email" placeholder="43gshs-1319@g.gne.go.kr" required />
        <label>별명 <span class="muted">(화면에 보이는 이름)</span></label>
        <input id="username" maxlength="20" required />
        <label>실명 <span class="muted">(관리자만 확인)</span></label>
        <input id="realname" maxlength="20" required />
        <label>비밀번호 <span class="muted">(6자 이상)</span></label>
        <input id="password" type="password" autocomplete="new-password" required />
        <div style="margin-top:16px"><button type="submit" style="width:100%">가입 신청</button></div>
      </form>
      <p class="muted" style="margin-top:14px">가입 신청 후 <b>관리자 승인</b>이 완료되면 로그인할 수 있습니다.</p>
      <p class="muted">이미 계정이 있나요? <a href="/login.html">로그인</a></p>
    </div>
  </main>
  <script type="module">
    import { renderNav, api, showMsg } from '/js/common.js';
    await renderNav();
    const msg = document.getElementById('msg');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const d = await api.post('/api/auth/register', {
          email: document.getElementById('email').value.trim(),
          username: document.getElementById('username').value.trim(),
          realname: document.getElementById('realname').value.trim(),
          password: document.getElementById('password').value,
        });
        showMsg(msg, d.message, true);
        document.getElementById('form').reset();
      } catch (err) { showMsg(msg, err.message); }
    });
  </script>
</body>
</html>
