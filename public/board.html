<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시판 · 큰들 커뮤니티</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div class="card">
      <h1 id="title"></h1>
      <p class="muted" id="subtitle"></p>
      <!-- 자료: 과목/분류 / 자유: 말머리 -->
      <div class="pills" id="pills1"></div>
      <div class="pills" id="pills2"></div>
      <div class="search-row">
        <div class="search grow"><input id="q" placeholder="제목·내용 검색" /></div>
        <select id="sort"><option value="recent">최신순</option><option value="popular">인기순</option></select>
      </div>
      <div id="feed" style="margin-top:8px"></div>
      <div class="pager" id="pager"></div>
    </div>
  </main>
  <a class="fab hidden" id="fab" href="#">✏️ 글쓰기</a>

  <script type="module">
    import { renderNav, api, esc, fmt, qs, getMeta } from '/js/common.js';
    const me = await renderNav({ requireLogin: true });
    const meta = await getMeta();

    const board = qs('board') || 'free';
    let subject = qs('subject') || '';
    let category = qs('category') || '';
    let tag = qs('tag') || '';
    let sort = qs('sort') || 'recent';
    let q = ''; let page = 1;

    const NAMES = { notice: '📢 공지사항', free: '💬 자유게시판', resource: '📚 자료공유게시판' };
    const SUBS = { notice: '관리자가 올리는 공지입니다.', free: '자유롭게 이야기하고 질문하세요.', resource: '과목별 수행평가·시험 자료를 공유해요.' };
    document.getElementById('title').textContent = NAMES[board] || '게시판';
    document.getElementById('subtitle').textContent = SUBS[board] || '';
    document.getElementById('sort').value = sort;

    // 글쓰기 버튼 (공지는 관리자만)
    const fab = document.getElementById('fab');
    if (!(board === 'notice' && me.role !== 'admin')) {
      fab.classList.remove('hidden');
      const wq = new URLSearchParams({ board });
      if (subject) wq.set('subject', subject); if (category) wq.set('category', category); if (tag) wq.set('tag', tag);
      fab.href = '/write.html?' + wq;
    }

    const p1 = document.getElementById('pills1'), p2 = document.getElementById('pills2');
    function renderPills() {
      if (board === 'resource') {
        p1.innerHTML = `<span class="pill ${!subject?'active':''}" data-s="">전체과목</span>` +
          meta.subjects.map((s) => `<span class="pill ${subject===s.code?'active':''}" data-s="${s.code}">${esc(s.name)}</span>`).join('');
        p2.innerHTML = `<span class="pill ${!category?'active':''}" data-c="">전체분류</span>` +
          meta.categories.map((c) => `<span class="pill ${category===c.code?'active':''}" data-c="${c.code}">${esc(c.name)}</span>`).join('');
        p1.querySelectorAll('[data-s]').forEach((el)=>el.addEventListener('click',()=>{subject=el.dataset.s;page=1;renderPills();load();}));
        p2.querySelectorAll('[data-c]').forEach((el)=>el.addEventListener('click',()=>{category=el.dataset.c;page=1;renderPills();load();}));
      } else if (board === 'free') {
        p1.innerHTML = `<span class="pill ${!tag?'active':''}" data-t="">전체</span>` +
          meta.tags.map((t) => `<span class="pill ${tag===t.code?'active':''}" data-t="${t.code}">${t.emoji} ${esc(t.name)}</span>`).join('');
        p1.querySelectorAll('[data-t]').forEach((el)=>el.addEventListener('click',()=>{tag=el.dataset.t;page=1;renderPills();load();}));
        p2.innerHTML = '';
      } else { p1.innerHTML = ''; p2.innerHTML = ''; }
    }

    const feedEl = document.getElementById('feed');
    async function load() {
      const params = new URLSearchParams({ board, page, sort });
      if (subject) params.set('subject', subject);
      if (category) params.set('category', category);
      if (tag) params.set('tag', tag);
      if (q) params.set('q', q);
      const d = await api.get('/api/posts?' + params);
      const tagName = (c) => { const t = meta.tags.find((x)=>x.code===c); return t?`${t.emoji} ${t.name}`:''; };
      const subName = (c) => { const s = meta.subjects.find((x)=>x.code===c); return s?s.name:''; };
      feedEl.innerHTML = d.posts.length ? d.posts.map((p) => `
        <div class="post-item" onclick="location.href='/post.html?id=${p.id}'">
          <div class="p-top">
            ${p.board==='notice'?'<span class="tag-chip notice">📢 공지</span>':''}
            ${p.board==='resource'&&p.subject?`<span class="tag-chip">${esc(subName(p.subject))}${p.category==='exam'?' · 시험':' · 수행'}</span>`:''}
            ${p.board==='free'&&p.tag?`<span class="tag-chip">${esc(tagName(p.tag))}</span>`:''}
            <span class="p-title">${esc(p.title)}</span>
          </div>
          <div class="p-meta"><span>${esc(p.author)}</span><span>${fmt(p.created_at)}</span><span>👁 ${p.views}</span><b>❤ ${p.like_count}</b><span>💬 ${p.comment_count}</span></div>
        </div>`).join('') : `<div class="empty">글이 없어요.</div>`;
      let html=''; for (let i=1;i<=d.totalPages;i++) html += i===d.page?`<span class="active">${i}</span>`:`<span data-pg="${i}">${i}</span>`;
      const pg=document.getElementById('pager'); pg.innerHTML=d.totalPages>1?html:'';
      pg.querySelectorAll('[data-pg]').forEach((s)=>s.addEventListener('click',()=>{page=+s.dataset.pg;load();scrollTo({top:0,behavior:'smooth'});}));
    }

    let t;
    document.getElementById('q').addEventListener('input',(e)=>{clearTimeout(t);t=setTimeout(()=>{q=e.target.value.trim();page=1;load();},300);});
    document.getElementById('sort').addEventListener('change',(e)=>{sort=e.target.value;page=1;load();});

    renderPills(); load();
  </script>
</body>
</html>
