<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반 채팅방 · 큰들 커뮤니티</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div class="card">
      <h1>⚡ 반 채팅방</h1>
      <p class="muted">3초마다 새 메시지가 자동으로 로드돼요. (비속어 시 벌점 +1)</p>
      <div class="chat-box" id="box"></div>
      <div id="msg" class="hidden"></div>
      <form id="form" style="margin-top:12px">
        <div class="row">
          <input id="input" class="grow" placeholder="메시지 입력…" autocomplete="off" required />
          <button type="submit">전송</button>
        </div>
      </form>
    </div>
  </main>
  <script type="module">
    import { renderNav, api, esc, fmt, showMsg } from '/js/common.js';
    const me = await renderNav({ requireLogin: true });
    const box = document.getElementById('box');
    let lastId = 0, timer;

    function render(messages) {
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
      for (const m of messages) {
        const div = document.createElement('div');
        div.className = 'chat-msg' + (m.author_id === me.id ? ' mine' : '');
        const canDel = m.author_id === me.id || me.role === 'admin';
        div.innerHTML = `<span class="who">${esc(m.author)}</span><span class="time">${fmt(m.created_at)}</span>
          ${canDel ? `<a href="#" class="muted" style="font-size:11px;margin-left:6px" data-del="${m.id}">삭제</a>` : ''}
          <div><span class="chat-bubble">${esc(m.content)}</span></div>`;
        box.appendChild(div);
        lastId = Math.max(lastId, m.id);
      }
      box.querySelectorAll('[data-del]').forEach((a) => {
        if (a.dataset.bound) return; a.dataset.bound = '1';
        a.addEventListener('click', async (e) => { e.preventDefault(); await api.del('/api/chat/' + a.dataset.del); a.closest('.chat-msg').remove(); });
      });
      if (atBottom) box.scrollTop = box.scrollHeight;
    }

    async function poll() { try { const d = await api.get('/api/chat?since=' + lastId); if (d.messages.length) render(d.messages); } catch {} }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('input');
      const text = input.value.trim(); if (!text) return;
      try {
        const r = await api.post('/api/chat', { content: text });
        input.value = '';
        if (r.penalty) showMsg(document.getElementById('msg'), `⚠️ 비속어 감지 — 벌점 ${r.penalty.demerit}점`);
        await poll();
      } catch (err) { showMsg(document.getElementById('msg'), err.message); }
    });

    await poll();
    box.scrollTop = box.scrollHeight;
    timer = setInterval(poll, 3000);
    window.addEventListener('beforeunload', () => clearInterval(timer));
  </script>
</body>
</html>
