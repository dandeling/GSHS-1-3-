<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>채팅방 · 1-3반 커뮤니티</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div class="card">
      <div class="row"><h1 class="grow" style="margin:0">⚡ 채팅방</h1>
        <button id="newRoom" class="btn-sm btn-ghost">＋ 방 만들기</button></div>
      <p class="muted">3초마다 새 메시지가 자동 로드돼요. (비속어 시 벌점 +1)</p>
      <div class="room-tabs" id="roomTabs"></div>
      <div class="chat-box" id="box"></div>
      <div id="msg" class="hidden"></div>
      <form id="form" style="margin-top:12px">
        <div class="row"><input id="input" class="grow" placeholder="메시지 입력…" autocomplete="off" required /><button type="submit">전송</button></div>
      </form>
    </div>
  </main>
  <script type="module">
    import { renderNav, api, esc, fmt, showMsg, levelBadge } from '/js/common.js';
    const me = await renderNav({ requireLogin: true });
    const box = document.getElementById('box');
    let rooms = [], curRoom = 1, lastId = 0, timer;

    async function loadRooms() {
      const d = await api.get('/api/chat/rooms');
      rooms = d.rooms;
      const tabs = document.getElementById('roomTabs');
      tabs.innerHTML = rooms.map((r) => {
        const lock = r.is_private ? (r.joined ? '🔓 ' : '🔒 ') : '';
        return `<span class="room-tab ${r.id===curRoom?'active':''}" data-room="${r.id}">${lock}${esc(r.name)} <span class="muted">${r.msg_count}</span></span>`;
      }).join('');
      tabs.querySelectorAll('[data-room]').forEach((el) => el.addEventListener('click', () => switchRoom(+el.dataset.room)));
    }

    async function switchRoom(id) {
      const room = rooms.find((r) => r.id === id);
      // 비밀방인데 아직 입장 안 했으면 입장코드 요청
      if (room && room.is_private && !room.joined) {
        const pw = prompt(`🔒 "${room.name}" 비밀방 입장코드:`);
        if (pw === null) return;
        try { await api.post(`/api/chat/rooms/${id}/join`, { password: pw }); }
        catch (err) { showMsg(document.getElementById('msg'), err.message); return; }
      }
      curRoom = id; lastId = 0; box.innerHTML = '';
      await loadRooms(); poll();
    }

    function render(messages) {
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
      for (const m of messages) {
        const div = document.createElement('div');
        div.className = 'chat-msg' + (m.author_id === me.id ? ' mine' : '');
        const canDel = m.author_id === me.id || me.role === 'admin';
        div.innerHTML = `${levelBadge(m.author_point, m.author_role)} <span class="who">${esc(m.author)}</span><span class="time">${fmt(m.created_at)}</span>
          ${canDel ? `<a href="#" class="muted" style="font-size:11px;margin-left:6px" data-del="${m.id}">삭제</a>` : ''}
          <div><span class="chat-bubble">${esc(m.content)}</span></div>`;
        box.appendChild(div);
        lastId = Math.max(lastId, m.id);
      }
      box.querySelectorAll('[data-del]').forEach((a) => {
        if (a.dataset.bound) return; a.dataset.bound = '1';
        a.addEventListener('click', async (e) => { e.preventDefault(); await api.del('/api/chat/' + a.dataset.del); a.closest('.chat-msg').remove(); });
      });
      if (atBottom) box.scrollTop = box.scrollHeight;
    }

    async function poll() {
      try { const d = await api.get(`/api/chat?room=${curRoom}&since=${lastId}`); if (d.messages.length) render(d.messages); } catch {}
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('input');
      const text = input.value.trim(); if (!text) return;
      try {
        const r = await api.post('/api/chat', { content: text, room: curRoom });
        input.value = '';
        if (r.penalty) showMsg(document.getElementById('msg'), `⚠️ 비속어 감지 — 벌점 ${r.penalty.demerit}점`);
        await poll();
      } catch (err) { showMsg(document.getElementById('msg'), err.message); }
    });

    document.getElementById('newRoom').addEventListener('click', async () => {
      const name = prompt('새 채팅방 이름:'); if (!name?.trim()) return;
      const isPrivate = confirm('비밀 단톡방으로 만들까요?\n\n[확인] = 🔒 비밀방 (입장코드 필요)\n[취소] = 🌐 공개방 (누구나 입장)');
      let password = null;
      if (isPrivate) { password = prompt('입장코드를 정하세요 (2자 이상):'); if (!password || password.length < 2) { alert('입장코드가 필요합니다.'); return; } }
      try {
        const r = await api.post('/api/chat/rooms', { name: name.trim(), is_private: isPrivate, password });
        curRoom = r.id; lastId = 0; box.innerHTML = '';
        await loadRooms(); poll();
        if (isPrivate) showMsg(document.getElementById('msg'), `🔒 비밀방 생성! 입장코드를 친구에게 공유하세요.`, true);
      } catch (err) { showMsg(document.getElementById('msg'), err.message); }
    });

    await loadRooms();
    await poll();
    box.scrollTop = box.scrollHeight;
    timer = setInterval(poll, 3000);
    window.addEventListener('beforeunload', () => clearInterval(timer));
  </script>
</body>
</html>
