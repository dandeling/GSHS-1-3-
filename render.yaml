# Render.com 배포 설정
# GitHub 저장소에 push하면 자동으로 사이트가 업데이트됩니다.
services:
  - type: web
    name: gshs-1-3-community
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false        # Render 대시보드에서 직접 입력
      - key: JWT_SECRET
        generateValue: true # 자동으로 임의 값 생성
    disk:
      name: data
      mountPath: /var/data # DATA_DIR와 동일 → 배포해도 데이터 유지
      sizeGB: 1
